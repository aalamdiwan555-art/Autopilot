kind = "mobile"
previewPath = "/"
title = "Autopilot"
description = "A driver-focused Android companion that gates first launch behind required permissions, monitors supported ride apps, and recognizes ride acceptance actions with a dark, focused interface."
version = "1.0.0"
id = "artifacts/autopilot"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 21147

[services.development]
run = "pnpm --filter @workspace/autopilot run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/autopilot", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/autopilot", "run", "serve" ]

[services.env]
PORT = "21147"
BASE_PATH = "/"
