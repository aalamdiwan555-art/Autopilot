kind = "mobile"
previewPath = "/"
title = "Autopilot"
description = "A calm, driver-focused mobile companion for starting and monitoring automated ride acceptance shifts, completing permissions setup, sharing referrals, and managing account preferences."
version = "1.0.0"
id = "artifacts/autopilot-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24068

[services.development]
run = "pnpm --filter @workspace/autopilot-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/autopilot-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/autopilot-mobile", "run", "serve" ]

[services.env]
PORT = "24068"
BASE_PATH = "/"
